name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Host Tests & Hardened ARM Build
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish-release:
    name: Publish GitHub Release
    needs: [verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified firmware artifact
        uses: actions/download-artifact@v8
        with:
          name: sp1-drum-firmware
          path: dist

      - name: Verify firmware SHA-256 checksum
        run: |
          set -euo pipefail
          ls -la dist
          (cd dist && sha256sum -c zephyr.bin.sha256)

      - name: Publish GitHub Release with categorized notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          EXTRA_ARGS=()
          if [[ "${TAG}" == *-* ]]; then
            EXTRA_ARGS+=(--prerelease)
          fi

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" \
              dist/zephyr.bin \
              dist/zephyr.bin.sha256 \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${TAG}" \
              dist/zephyr.bin \
              dist/zephyr.bin.sha256 \
              --repo "${GITHUB_REPOSITORY}" \
              --title "sp1-drum ${TAG}" \
              --generate-notes \
              --verify-tag \
              "${EXTRA_ARGS[@]}"
          fi
